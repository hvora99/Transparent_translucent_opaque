<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Lab - Final Projector Suite</title>
    <style>
        :root {
            --bg: #f8fafc; --panel: #ffffff; --text: #0f172a; --ray-col: #fbbf24; --accent: #0284c7;
        }
        .dark-mode {
            --bg: #020617; --panel: #1e293b; --text: #f8fafc; --accent: #38bdf8;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: var(--bg); color: var(--text); 
            display: flex; flex-direction: column; align-items: center; 
            padding: 20px; transition: 0.3s; font-weight: 800;
        }
        
        h1 { font-size: 3rem; text-transform: uppercase; margin-top: 10px; margin-bottom: 20px; border-bottom: 6px solid var(--accent); }

        .lab-bench {
            width: 100%; max-width: 1150px; height: 450px; background: var(--panel);
            border-radius: 25px; position: relative; border: 6px solid #cbd5e1;
            display: flex; align-items: center; overflow: hidden; margin-bottom: 15px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15);
        }

        /* Torch Assembly */
        #light-source-assembly {
            position: absolute; left: 30px; height: 60px; width: 100px;
            display: flex; align-items: center; transition: left 0.3s, transform 0.1s;
            transform-origin: 100px center; z-index: 20;
        }
        .torch-body { width: 100px; height: 45px; background: #334155; border-radius: 8px; position: relative; }
        .torch-body::after { content: ''; position: absolute; right: -20px; top: -12px; width: 25px; height: 70px; background: #475569; border-radius: 6px; }

        /* Ray System */
        .beam-system { position: absolute; left: 120px; width: 1200px; height: 100px; display: flex; align-items: center; pointer-events: none; }
        .ray { position: absolute; left: 0; height: 6px; width: 0; background: var(--ray-col); transform-origin: left center; transition: 0.3s; box-shadow: 0 0 10px var(--ray-col); }

        /* Material */
        #material-block { 
            position: absolute; left: 520px; width: 65px; height: 320px; 
            border: 4px solid #94a3b8; border-radius: 12px; 
            z-index: 15; display: flex; align-items: center; justify-content: center; 
            font-size: 1rem; color: #000; text-align: center; transition: 0.5s;
        }

        #shadow-zone { position: absolute; left: 585px; width: 500px; height: 380px; z-index: 5; pointer-events: none; transform-origin: left center; }

        .sensor { 
            position: absolute; right: 40px; width: 160px; height: 180px; 
            background: #0f172a; border: 6px solid var(--accent); border-radius: 20px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: var(--accent); box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        #graph-area {
            width: 100%; max-width: 1150px; height: 120px; background: #000;
            border-radius: 20px; margin-bottom: 25px; position: relative; border: 4px solid #334155;
        }

        /* Controls */
        .controls-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; width: 100%; max-width: 1150px; background: var(--panel); 
            padding: 30px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            font-size: 1.1rem;
        }
        
        .control-group { display: flex; flex-direction: column; }
        select, input[type="range"] { width: 100%; height: 50px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 5px; }
        
        .btn-box { display: flex; flex-direction: column; gap: 10px; margin-top: 5px; }
        button { 
            width: 100%; padding: 15px; border: none; border-radius: 12px; 
            cursor: pointer; font-weight: 900; font-size: 1.2rem; text-transform: uppercase;
            color: white; transition: 0.2s;
        }

        /* Results Table */
        .table-container { width: 100%; max-width: 1150px; margin-top: 30px; margin-bottom: 50px; }
        table { width: 100%; background: var(--panel); border-collapse: collapse; border: 5px solid #cbd5e1; border-radius: 15px; overflow: hidden; font-size: 1.3rem; }
        th, td { padding: 20px; border: 2px solid #cbd5e1; text-align: center; }
        th { background: var(--accent); color: white; }
    </style>
</head>
<body>

<h1>OPTICAL LABORATORY</h1>

<div class="lab-bench">
    <div id="light-source-assembly">
        <div class="torch-body"></div>
        <div class="beam-system" id="beam-container"></div>
    </div>
    <div id="material-block">SELECT</div>
    <div id="shadow-zone"></div>
    <div class="sensor">
        <span style="font-size: 1rem;">BRIGHTNESS</span>
        <div id="brightness-val" style="font-size: 4rem;">0%</div>
    </div>
</div>

<div id="graph-area">
    <svg width="100%" height="120" style="position:absolute;">
        <polyline id="graph-polyline" points="" style="fill:none;stroke:var(--accent);stroke-width:6" />
    </svg>
    <div style="position:absolute; top:10px; left:20px; color:var(--accent); font-size:1rem;">LIVE BRIGHTNESS TRACKER</div>
</div>

<div class="controls-grid">
    <div class="control-group">
        <label>1. MATERIAL</label>
        <select id="mat-select" onchange="updateSim()">
            <option value="">-- CHOOSE --</option>
            <optgroup label="TRANSPARENT">
                <option value="Glass">Glass</option><option value="Water">Water</option><option value="Diamond">Diamond</option>
                <option value="Ruby">Ruby</option><option value="Emerald">Emerald</option><option value="Sapphire">Sapphire</option>
            </optgroup>
            <optgroup label="TRANSLUCENT">
                <option value="Frosted">Frosted Glass</option><option value="Honey">Honey</option><option value="RedWine">Red Wine</option><option value="ButterPaper">Butter Paper</option>
            </optgroup>
            <optgroup label="OPAQUE">
                <option value="Wood">Oak Wood</option><option value="Iron">Iron</option><option value="Mirror">Mirror</option><option value="Brick">Brick</option><option value="Gold">Gold</option>
            </optgroup>
        </select>
    </div>

    <div class="control-group">
        <label>2. DISTANCE</label>
        <input type="range" id="dist-slider" min="30" max="400" value="100" oninput="updateSim()">
    </div>

    <div class="control-group">
        <label>3. ANGLE</label>
        <input type="range" id="angle-slider" min="-30" max="30" value="0" oninput="updateSim()">
    </div>

    <div class="control-group">
        <label>4. INTENSITY</label>
        <input type="range" id="intensity-slider" min="0" max="100" value="80" oninput="updateSim()">
    </div>

    <div class="btn-box">
        <button style="background:var(--accent)" onclick="logResult()">SAVE DATA</button>
        <button style="background:#64748b" onclick="document.body.classList.toggle('dark-mode')">NIGHT MODE</button>
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>MATERIAL</th>
                <th>DISTANCE</th>
                <th>ANGLE</th>
                <th>BRIGHTNESS</th>
            </tr>
        </thead>
        <tbody id="log-body">
            </tbody>
    </table>
    <button style="background:#ef4444; margin-top: 15px;" onclick="document.getElementById('log-body').innerHTML = ''">CLEAR TABLE</button>
</div>

<script>
    const mats = {
        "Glass": { p: 0.95, c: "rgba(200,240,255,0.3)", f: "#fbbf24" },
        "Water": { p: 0.9, c: "rgba(0,191,255,0.1)", f: "#7dd3fc" },
        "Diamond": { p: 0.85, c: "rgba(255,255,255,0.3)", f: "#ffffff" },
        "Ruby": { p: 0.7, c: "rgba(255,0,0,0.4)", f: "#ef4444" },
        "Emerald": { p: 0.7, c: "rgba(16,185,129,0.4)", f: "#10b981" },
        "Sapphire": { p: 0.7, c: "rgba(59,130,246,0.4)", f: "#3b82f6" },
        "Frosted": { p: 0.4, c: "rgba(255,255,255,0.8)", f: "#fbbf24" },
        "Honey": { p: 0.4, c: "rgba(245,158,11,0.6)", f: "#fbbf24" },
        "RedWine": { p: 0.35, c: "rgba(153,27,27,0.7)", f: "#991b1b" },
        "ButterPaper": { p: 0.3, c: "#fef3c7", f: "#fbbf24" },
        "Wood": { p: 0, c: "#78350f", f: "none" },
        "Iron": { p: 0, c: "#475569", f: "none" },
        "Mirror": { p: 0, c: "#e2e8f0", f: "none" },
        "Brick": { p: 0, c: "#b91c1c", f: "none" },
        "Gold": { p: 0, c: "#fbbf24", f: "none" }
    };

    let graphData = [];
    const container = document.getElementById('beam-container');
    for(let i = -3; i <= 3; i++) {
        let r = document.createElement('div');
        r.className = 'ray'; r.id = `r${i+3}`;
        r.style.transform = `rotate(${i * 5}deg)`; 
        container.appendChild(r);
    }

    function hexToRgb(hex) {
        if (!hex || hex === 'none') return "251, 191, 36";
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : "251, 191, 36";
    }

    function updateSim() {
        const val = document.getElementById('mat-select').value;
        const pwr = document.getElementById('intensity-slider').value / 100;
        const dist = parseInt(document.getElementById('dist-slider').value);
        const angle = parseInt(document.getElementById('angle-slider').value);
        const assembly = document.getElementById('light-source-assembly');
        
        assembly.style.left = dist + "px";
        assembly.style.transform = `rotate(${angle}deg)`;

        if(!val) return;
        const d = mats[val];
        const block = document.getElementById('material-block');
        block.innerText = val.toUpperCase();
        block.style.backgroundColor = d.c;

        let distFactor = 1 - ((dist - 30) / 750);
        let brightness = Math.round(d.p * 100 * pwr * Math.abs(Math.cos(angle * Math.PI / 180)) * distFactor);
        document.getElementById('brightness-val').innerText = brightness + "%";

        graphData.push(120 - (brightness * 1.2));
        if(graphData.length > 200) graphData.shift();
        let points = graphData.map((y, x) => `${x * 6},${y}`).join(" ");
        document.getElementById('graph-polyline').setAttribute("points", points);

        const bp = 520;
        const d2b = (bp - (dist + 100)) / Math.cos(angle * Math.PI / 180);
        document.getElementById('shadow-zone').style.transform = `rotate(${angle}deg)`;
        document.getElementById('shadow-zone').style.background = `linear-gradient(90deg, rgba(0,0,0,${(1 - d.p) * pwr * 0.85}), transparent)`;

        const rgbStr = hexToRgb(d.f);

        for(let i = 0; i < 7; i++) {
            const ray = document.getElementById(`r${i}`);
            ray.style.opacity = pwr;
            
            if (d.p === 0) {
                ray.style.width = d2b + "px";
                ray.style.background = "#fbbf24";
                ray.style.boxShadow = "0 0 10px #fbbf24";
            } else {
                ray.style.width = "1200px";
                // If the material is translucent (p < 0.8), make the ray dimmer (opacity d.p) after the block
                const afterOpacity = d.p < 0.8 ? d.p : 1;
                ray.style.background = `linear-gradient(90deg, rgba(251, 191, 36, 1) ${d2b}px, rgba(${rgbStr}, ${afterOpacity}) ${d2b}px)`;
                
                // Dim the glow for translucent materials
                if (d.p < 0.8) {
                    ray.style.boxShadow = `0 0 ${5 * d.p}px rgba(${rgbStr}, 0.5)`;
                } else {
                    ray.style.boxShadow = `0 0 10px rgba(${rgbStr}, 0.8)`;
                }
            }
        }
    }

    function logResult() {
        const val = document.getElementById('mat-select').value;
        if(!val) return;
        const dist = document.getElementById('dist-slider').value + "px";
        const angle = document.getElementById('angle-slider').value + "°";
        const res = document.getElementById('brightness-val').innerText;
        const row = `<tr><td>${val}</td><td>${dist}</td><td>${angle}</td><td>${res}</td></tr>`;
        document.getElementById('log-body').innerHTML = row + document.getElementById('log-body').innerHTML;
    }
</script>
</body>
    </html>
